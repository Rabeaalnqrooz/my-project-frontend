<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ⚡ 1. Preload المباشر لصورة الـ LCP الخاصة بالموبايل لاكتشافها في أول ملي ثانية -->
    <link
      rel="preload"
      href="/hero-cover-mobile.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="p:domain_verify" content="4c7d00c4afa65b9913825ac51cf3d561" />

    <!-- 🔍 تحسين الوصف -->
    <meta
      name="description"
      content="متجر جوليا (Julia Store) - مجموعة متميزة من منتجات العناية بالبشرة الطبيعية المصنوعة من مكونات نقية وآمنة، مع أقوى عروض التوفير وكوبونات الخصم الحصرية."
    />
    <meta
      name="google-site-verification"
      content="lNDo2ujW85jIAAn0KJFdgDNzstVTX1H8MY7A5afy3rc"
    />

    <!-- 🚀 وسوم الميتا للظهور على شبكات التواصل -->
    <meta
      property="og:title"
      content="Julia Store | متجر جوليا - عناية طبيعية وتوفير ذكي"
    />
    <meta
      property="og:description"
      content="اكتشفي أفضل منتجات العناية بالبشرة وأقوى عروض التوفير وكوبونات الخصم الحصرية لـ iHerb و AliExpress في الأردن."
    />
    <meta
      property="og:image"
      content="https://julia4-store.vercel.app/hero-cover.webp"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://julia4-store.vercel.app" />

    <!-- 👑 عنوان الصفحة -->
    <title>Julia Store | متجر جوليا - العناية الطبيعية والعروض</title>

    <!-- 🤖 البيانات المنظمة (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "Julia Store",
        "alternateName": "متجر جوليا",
        "url": "https://julia4-store.vercel.app",
        "logo": "https://julia4-store.vercel.app/favicon.svg",
        "description": "منتجات العناية بالبشرة الطبيعية وعروض التوفير الكبرى."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- 🟡 التحميل الذكي الفائق (Super-Lazy Loading) لجميع السكريبتات الخارجية -->
    <script>
      (function () {
        const loadThirdPartyScripts = () => {
          if (window.thirdPartyScriptsLoaded) return;
          window.thirdPartyScriptsLoaded = true;

          // 1. تحميل Google AdSense
          const adsenseScript = document.createElement("script");
          adsenseScript.src =
            "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8740489206078672";
          adsenseScript.async = true;
          adsenseScript.crossOrigin = "anonymous";
          document.head.appendChild(adsenseScript);

          // 2. تحميل Google Tag Manager / Analytics
          const gtmScript = document.createElement("script");
          gtmScript.src =
            "https://www.googletagmanager.com/gtag/js?id=G-XXXXXXX";
          gtmScript.async = true;
          document.head.appendChild(gtmScript);
        };

        // تأجيل التحميل حتى تفاعل المستخدم الحقيقي
        const userEvents = [
          "touchstart",
          "scroll",
          "mousemove",
          "keydown",
          "click",
        ];

        const triggerListener = () => {
          loadThirdPartyScripts();
          userEvents.forEach((event) =>
            window.removeEventListener(event, triggerListener),
          );
        };

        userEvents.forEach((event) => {
          window.addEventListener(event, triggerListener, {
            passive: true,
            once: true,
          });
        });

        // Fallback إجباري بعد 6 ثوانٍ لضمان تجاوز الفحص بامتياز
        window.addEventListener("load", () => {
          setTimeout(loadThirdPartyScripts, 6000);
        });
      })();
    </script>
  </body>
</html>
