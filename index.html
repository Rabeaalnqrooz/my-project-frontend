<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ⚡ Preload لملف الخط لإنهاء مشكلة حظر العرض -->
    <link
      rel="preload"
      href="/assets/geist-lat.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- ⚡ تحميل صورة الهيرو بأعلى أولوية ممكنة -->
    <link
      rel="preload"
      as="image"
      href="/hero-cover.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 🔍 تحسين الوصف ليتضمن اسم المتجر بالعربي والإنجليزي -->
    <meta
      name="description"
      content="متجر جوليا (Julia Store) - مجموعة متميزة من منتجات العناية بالبشرة الطبيعية المصنوعة من مكونات نقية وآمنة، مع أقوى عروض التوفير وكوبونات الخصم الحصرية."
    />
    <meta
      name="google-site-verification"
      content="lNDo2ujW85jIAAn0KJFdgDNzstVTX1H8MY7A5afy3rc"
    />

    <!-- ============================================= -->
    <!-- 🚀 وسوم الميتا الذكية للظهور الاحترافي على واتساب وفيسبوك -->
    <!-- ============================================= -->
    <meta
      property="og:title"
      content="Julia Store | متجر جوليا - عناية طبيعية وتوفير ذكي"
    />
    <meta
      property="og:description"
      content="اكتشفي أفضل منتجات العناية بالبشرة وأقوى عروض التوفير وكوبونات الخصم الحصرية لـ iHerb و AliExpress في الأردن."
    />
    <meta
      property="og:image"
      content="https://julia4-store.vercel.app/hero-cover.webp"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://julia4-store.vercel.app" />
    <!-- ============================================= -->

    <!-- 👑 عنوان الصفحة المستهدف لمحركات البحث -->
    <title>Julia Store | متجر جوليا - العناية الطبيعية والعروض</title>

    <!-- 🤖 البيانات المنظمة (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "Julia Store",
        "alternateName": "متجر جوليا",
        "url": "https://julia4-store.vercel.app",
        "logo": "https://julia4-store.vercel.app/favicon.svg",
        "description": "منتجات العناية بالبشرة الطبيعية وعروض التوفير الكبرى."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- 🟡 Google AdSense: تحميل ذكي ومؤجل لتحرير الرندر الأول ورفع سكور السرعة (FCP / LCP) -->
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const loadAdSense = () => {
          if (window.adsenseLoaded) return;
          window.adsenseLoaded = true;
          const script = document.createElement("script");
          script.src =
            "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8740489206078672";
          script.async = true;
          script.crossOrigin = "anonymous";
          document.head.appendChild(script);
        };

        // تحميل أدسنس فور أول تفاعل للمستخدم أو بعد 2.5 ثانية تلقائياً
        ["touchstart", "scroll", "mousemove", "click"].forEach((event) => {
          window.addEventListener(event, loadAdSense, {
            once: true,
            passive: true,
          });
        });

        setTimeout(loadAdSense, 2500);
      });
    </script>
  </body>
</html>
